name: Build webOS Arabic test
on:
  push:
    branches: [fix/arabic-subtitles-v2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool make gcc g++ meson ninja-build pkg-config python3-pyelftools libass-dev libsdl2-dev libgles2-mesa-dev cmake
      - name: Test subtitle routing and Arabic shaping
        run: |
          bash tests/bidi.sh
          bash tests/legenda2.sh
          bash tests/legenda_ass.sh
          bash tests/plainass.sh
          ASAN_OPTIONS=detect_leaks=0 SANITIZE=1 bash tests/plainass.sh
      - name: Cache pinned ARM dependencies
        uses: actions/cache@v4
        with:
          path: |
            /tmp/nuvio-webos-ci/sdk
            /tmp/nuvio-webos-ci/sdk.tar.gz
            /tmp/nuvio-webos-ci/ass
            /tmp/nuvio-webos-ci/p2p
          key: webos-v2-a38c582-ass0175-p2p02938d75-1
      - name: Compile and package ARM application
        env:
          NUVIO_CI_PYTHON: /usr/bin/python3
        run: bash tools/ci-webos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nuvio-lg-arabic-test
          path: dist/
          if-no-files-found: error
          retention-days: 30
  publish-test:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: nuvio-lg-arabic-test
          path: dist
      - name: Publish a test release and Homebrew Channel source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_SHA: ${{ github.sha }}
          RELEASE_TAG: arabic-v2-test-${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import hashlib,json,os,pathlib
          repo=os.environ['GH_REPO']; tag=os.environ['RELEASE_TAG']
          ipk=next(pathlib.Path('dist').glob('*.ipk'))
          base=f'https://github.com/{repo}/releases/download/{tag}/'
          manifest=dict(id='space.nuvio.native.legacy',version='2.0.1',type='native',title='Nuvio Legacy Arabic Test',appDescription='Upstream 2.0.0 with the TV-tested Arabic subtitle fix ported from our 1.7.8 build. LG C3 upgrade validation pending.',iconUri=f'https://raw.githubusercontent.com/{repo}/{os.environ["BUILD_SHA"]}/deploy/app/icon.png',sourceUrl=f'https://github.com/{repo}/tree/fix/arabic-subtitles-v2',rootRequired=False,ipkUrl=base+ipk.name,ipkHash=dict(sha256=hashlib.sha256(ipk.read_bytes()).hexdigest()),ipkSize=ipk.stat().st_size)
          pathlib.Path('dist/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          index=dict(packages=[dict(id=manifest['id'],title=manifest['title'],iconUri=manifest['iconUri'],manifestUrl=base+'manifest.json',manifest=manifest,shortDescription=manifest['appDescription'])])
          pathlib.Path('dist/apps.json').write_text(json.dumps(index,indent=2)+'\n')
          PY
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$BUILD_SHA" --prerelease \
              --title "LG Arabic test $GITHUB_RUN_NUMBER" \
              --notes 'Experimental build based on upstream 2.0.0. Uses existing libass for Arabic SRT/VTT shaping and BiDi. Package version 2.0.1 is a test upgrade, not an upstream release. Same application ID replaces the installed app. LG C3 testing confirmed readable Arabic, balanced sizing and Latin digits. Dialogue-marker behavior varies by subtitle source. The previous 1.7.8 candidate also passed TV position testing. This candidate ports those fixes to upstream 2.0.0, retains its native P2P engine and adapts primary subtitle geometry to the second subtitle feature; TV upgrade validation is pending. For Homebrew Channel, add the apps.json asset URL as a repository. Rollback: install the official 2.0.0 package.'
          fi
          gh release upload "$RELEASE_TAG" dist/* --clobber
          echo "Homebrew Channel source: https://github.com/$GH_REPO/releases/download/$RELEASE_TAG/apps.json" >> "$GITHUB_STEP_SUMMARY"
